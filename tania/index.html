<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Viaje del Alma · Una invitación de Tania</title>
<meta property="og:title" content="Viaje del Alma · Una invitación de Tania">
<meta property="og:description" content="Ritual diario, carta del día, tarot y luna. Crea tu cuenta gratis en Android, iPhone u ordenador.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Viaje del Alma">
<meta property="og:image" content="https://viajedelalma.app/og-image.jpg">

<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#080614;color:#E8D9A0;font-family:Georgia,serif;text-align:center;padding:16px;box-sizing:border-box}
main{max-width:420px}
a.b{display:block;margin:12px 0;padding:14px 18px;border:1px solid #C49A3C;border-radius:14px;color:#E8D9A0;text-decoration:none}
a.b:first-of-type{background:#C49A3C;color:#080614}
</style>
</head>
<body>
<!-- Enlace corto de la invitación de Tania (27-oct-2026; la PO: «mejor sí»).
     Android → ficha de Google Play con la campaña en el referrer; iPhone, iPad y ordenador → app web.
     ?m=qr marca las visitas que llegan por el QR de la tarjeta; sin nada, medio «enlace».
     Cuenta el clic en GoatCounter sin cookies y sin identificar a nadie. Campaña: tania_2710. -->
<main>
<p>Te llevamos a Viaje del Alma…</p>
<a class="b" id="play" href="https://play.google.com/store/apps/details?id=com.viajedelalma.app&amp;referrer=utm_source%3Dtania%26utm_medium%3Denlace%26utm_campaign%3Dtania_2710">Tengo Android · Google Play</a>
<a class="b" id="web" href="https://viajedelalma.app/web/?utm_source=tania&amp;utm_medium=enlace&amp;utm_campaign=tania_2710">Tengo iPhone u ordenador · Entrar desde el navegador</a>
</main>
<script>
(function () {
  var medio = "enlace";
  try {
    var m = new URLSearchParams(location.search).get("m");
    if (m === "qr") medio = "qr";
  } catch (e) {}
  var utm = "utm_source=tania&utm_medium=" + medio + "&utm_campaign=tania_2710";
  var PLAY = "https://play.google.com/store/apps/details?id=com.viajedelalma.app&referrer=" + encodeURIComponent(utm);
  var WEB = "https://viajedelalma.app/web/?" + utm;
  document.getElementById("play").href = PLAY;
  document.getElementById("web").href = WEB;
  var android = /Android/i.test(navigator.userAgent || "");
  var DESTINO = android ? PLAY : WEB, EVENTO = android ? "tania-android" : "tania-web";
  var hecho = false;
  function ir() { if (!hecho) { hecho = true; location.replace(DESTINO); } }
  function cuenta() {
    try { window.goatcounter.count({ path: EVENTO + "-" + medio, title: "Invitación de Tania", event: true }); } catch (e) {}
    setTimeout(ir, 350);
  }
  var s = document.createElement("script");
  s.async = true;
  s.src = "//gc.zgo.at/count.js";
  s.setAttribute("data-goatcounter", "https://viajedelalma.goatcounter.com/count");
  s.setAttribute("data-goatcounter-settings", '{"no_onload": true}');
  s.onload = cuenta;
  s.onerror = ir;
  document.head.appendChild(s);
  setTimeout(ir, 1500);
})();
</script>
</body>
</html>
