<!-- Enlace corto del primer comentario de Facebook (25-oct-2026; la PO: «parrafadas tremendas»).
     Lleva al mismo destino y con la misma medición (UTM) que el enlace largo, y cuenta el clic
     en GoatCounter sin cookies y sin identificar a nadie. Campaña: alma_2510. -->
<p>Te llevamos a Google Play…<br><a href="https://play.google.com/store/apps/details?id=com.viajedelalma.app&amp;referrer=utm_source%3Dfacebook%26utm_medium%3Dcomentario%26utm_campaign%3Dalma_2510">Si no se abre, pulsa aquí</a></p>
<script>
(function () {
  var DESTINO = "https://play.google.com/store/apps/details?id=com.viajedelalma.app&referrer=utm_source%3Dfacebook%26utm_medium%3Dcomentario%26utm_campaign%3Dalma_2510", EVENTO = "fb-alma-play";
  var hecho = false;
  function ir() { if (!hecho) { hecho = true; location.replace(DESTINO); } }
  function cuenta() {
    try { window.goatcounter.count({ path: EVENTO, title: "Enlace corto de Facebook", event: true }); } catch (e) {}
    setTimeout(ir, 350);
  }
  var s = document.createElement("script");
  s.async = true;
  s.src = "//gc.zgo.at/count.js";
  s.setAttribute("data-goatcounter", "https://viajedelalma.goatcounter.com/count");
  s.setAttribute("data-goatcounter-settings", '{"no_onload": true}');
  s.onload = cuenta;
  s.onerror = ir;
  document.head.appendChild(s);
  setTimeout(ir, 1500);
})();
</script>
</body>
