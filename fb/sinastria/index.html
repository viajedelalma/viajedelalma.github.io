<p>Te llevamos a vuestra sinastría…<br><a href="https://viajedelalma.app/sinastria/?utm_source=facebook&amp;utm_medium=comentario&amp;utm_campaign=sin_2910">Si no se abre, pulsa aquí</a></p>
<script>
(function () {
  var DESTINO = "https://viajedelalma.app/sinastria/?utm_source=facebook&utm_medium=comentario&utm_campaign=sin_2910", EVENTO = "fb-sinastria-web";
  var hecho = false;
  function ir() { if (!hecho) { hecho = true; location.replace(DESTINO); } }
  function cuenta() {
    try { window.goatcounter.count({ path: EVENTO, title: "Enlace corto de Facebook", event: true }); } catch (e) {}
    setTimeout(ir, 350);
  }
  var s = document.createElement("script");
  s.async = true;
  s.src = "//gc.zgo.at/count.js";
  s.setAttribute("data-goatcounter", "https://viajedelalma.goatcounter.com/count");
  s.setAttribute("data-goatcounter-settings", '{"no_onload": true}');
  s.onload = cuenta;
  s.onerror = ir;
  document.head.appendChild(s);
  setTimeout(ir, 1500);
})();
</script>
